name: Recover notifications
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: notification-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recover pending deliveries and synchronize repositories
        env:
          CRON_SECRET: ${{ secrets.GH_NOTIFS_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 295 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://gh-notifs-miskibins-projects.vercel.app/api/cron
